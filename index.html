<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国語 単語学習</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf7f2; --card:#fff; --accent:#b5505a; --accent-light:#f3dde0; --text:#2c2420; --text-sub:#7a6a56; --border:#e8ddd5; --gold:#a07830; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:var(--bg); color:var(--text); font-family:'Noto Serif JP',serif; }
  .wrapper { max-width:760px; margin:0 auto; padding:64px 24px 80px; }
  .version { display:inline-block; padding:5px 12px; border-radius:20px; background:var(--accent-light); color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.08em; margin-bottom:18px; }
  .hero { text-align:center; margin-bottom:48px; }
  .hero .subtitle { font-size:11px; letter-spacing:.25em; color:var(--text-sub); text-transform:uppercase; margin-bottom:10px; }
  .hero h1 { font-size:30px; letter-spacing:.08em; }
  .hero::after { content:''; display:block; width:60px; height:3px; background:var(--accent); margin:20px auto 0; }
  .term-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .term-card { min-width:0; padding:30px 28px; background:var(--card); border:1px solid var(--border); border-radius:8px; color:var(--text); text-decoration:none; box-shadow:0 2px 8px rgba(44,36,32,.06); transition:transform .15s, box-shadow .15s, border-color .15s; }
  .term-card:hover { transform:translateY(-3px); box-shadow:0 8px 22px rgba(44,36,32,.11); border-color:#d9b4b7; }
  .term-card .term-en { font-size:11px; color:var(--accent); letter-spacing:.16em; text-transform:uppercase; margin-bottom:8px; font-weight:700; }
  .term-card h2 { font-size:22px; margin-bottom:8px; letter-spacing:.05em; }
  .term-card p { color:var(--text-sub); font-size:13px; line-height:1.8; }
  .term-card .range { display:block; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); font-size:12px; color:var(--text-sub); }
  .term-card.sem2 .term-en { color:var(--gold); }
  .footer { margin-top:42px; text-align:center; color:var(--text-sub); font-size:12px; line-height:1.8; }
  @media (max-width:580px) { .wrapper{padding:44px 18px 60px}.hero h1{font-size:26px}.term-grid{grid-template-columns:1fr}.term-card{padding:24px 22px} }
</style>
</head>
<body>
<main class="wrapper">
  <header class="hero">
    <span class="version">ver.3.0</span>
    <p class="subtitle">北海道大学 · 中国語</p>
    <h1>単語学習</h1>
  </header>
  <div class="term-grid">
    <a class="term-card" href="semester1.html">
      <div class="term-en">Chinese I · First Semester</div>
      <h2>前期（中国語 I）</h2>
      <p>前期の単語一覧・クイズ・学習進捗を開きます。</p>
      <span class="range">第1課〜第16課 · 第1〜4単元</span>
    </a>
    <a class="term-card sem2" href="semester2.html">
      <div class="term-en">Chinese II · Second Semester</div>
      <h2>後期（中国語 II）</h2>
      <p>後期の単語一覧・クイズ・学習進捗を開きます。</p>
      <span class="range">第17課〜第28課 · 第5〜7単元</span>
    </a>
  </div>
  <p class="footer">学期を選んで学習を始めてください。</p>
</main>
</body>
</html>
